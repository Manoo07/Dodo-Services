services:
  postgres:
    image: postgres:16-alpine
    container_name: dodo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-dodo}
      POSTGRES_USER: ${DB_USER:-dodo}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      # Mounted from the 6 GB loop-device filesystem created by deploy.sh
      - /var/dodo/pgdata:/var/lib/postgresql/data
    ports:
      # Bind to localhost only — backend on the same machine connects via 127.0.0.1
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-dodo} -d ${DB_NAME:-dodo}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 256m
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
